<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-text">J.A.R.V.I.S</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="topbar-actions">
      <button id="btn-minimize" class="icon-btn" title="Minimizar a bolita">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="main-grid">
    <div class="card">
      <h3>Sistema</h3>
      <div class="stat-row"><span>CPU</span><b id="cpu-value">--%</b></div>
      <div class="stat-row"><span>RAM</span><b id="ram-value">--%</b></div>
      <div class="stat-row-sub" id="ram-detail">-- / -- GB</div>
    </div>

  <div class="card">
    <h3>Clima · Lima</h3>
    <div class="weather-main">
      <span id="weather-temp" class="weather-temp">--°C</span>
      <span id="weather-desc" class="weather-desc">--</span>
    </div>
    <div class="stat-row-sub" id="weather-detail">--</div>
  </div>

    <!-- Sidebar izquierda -->
    <aside class="panel side-panel">
      <div class="card">
        <h3>Estado</h3>
        <div class="orb-status">
          <div class="orb-dot" id="orb-indicator"></div>
          <span id="orb-state-label">En reposo</span>
        </div>
      </div>

      <div class="card">
        <h3>Accesos rápidos</h3>
        <div class="quick-actions">
          <button class="quick-btn" data-msg="¿cómo está el clima hoy?">Clima de hoy</button>
          <button class="quick-btn" data-msg="¿qué tengo pendiente hoy?">Pendientes</button>
        </div>
      </div>
    </aside>

    <!-- Conversación central -->
    <main class="panel chat-panel">
      <div class="chat-header">
        <h2>Conversación</h2>
        <button id="btn-clear" class="ghost-btn">Limpiar</button>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg msg-assistant">
          <div class="bubble">Hola, soy JARVIS. Backend activo. ¿En qué te ayudo hoy?</div>
          <span class="msg-time">--:--</span>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="btn-send" class="send-btn" title="Enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 11l18-8-8 18-2-8-8-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </main>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
